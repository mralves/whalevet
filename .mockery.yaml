# mockery v3 configuration (https://vektra.github.io/mockery/).
# No interface needs mocks yet, so `packages` is empty. When one exists, list
# it under `packages` (e.g. `github.com/mralves/whalevet/internal/image:`) and
# run `mise run mock`.
dir: "mocks"
structname: "Mock{{.InterfaceName}}"
pkgname: "mocks"
template: "testify"
template-data:
  unroll-variadic: true
packages: {}